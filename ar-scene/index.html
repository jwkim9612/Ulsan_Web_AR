<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ulsan_AR - AR Scene</title>

  <!-- 퍼즐(이미지 트래킹) = MindAR(MIT, three.js 기반). "three"는 peer 의존성이라 import map으로 지정.
       sRGBEncoding이 three@0.169+에서 제거돼서 mind-ar@1.2.5가 깨지므로 0.160.0으로 고정. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- 쓰레기줍기(손 인식) = MediaPipe Hands(구글, 무료 오픈소스). drawing_utils로 손 관절 표시. -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }

    #mindar-container { position: fixed; inset: 0; }
    #hand-video {
      position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
      display: none;
    }
    #hand-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
      display: none; z-index: 5; pointer-events: none;
    }

    #back-btn {
      position: fixed; top: 16px; left: 16px; z-index: 30;
      width: 44px; height: 44px; border: none; border-radius: 50%;
      background: rgba(0,0,0,0.5); color: #fff; font: bold 20px sans-serif;
    }

    #mode-panel {
      position: fixed; top: 16px; left: 76px; right: 16px; z-index: 30;
      display: flex; gap: 8px;
      background: rgba(0,0,0,0.4); border-radius: 24px; padding: 6px;
    }
    #mode-panel button {
      flex: 1; border: none; border-radius: 18px; padding: 12px 0;
      font: bold 16px sans-serif; color: #fff; background: transparent;
    }
    #mode-panel button.active { background: #2ea5ff; }

    /* 퍼즐 모드: 화면 중앙 2x2 조각 그리드(못 모은 조각은 반투명) */
    #puzzle-hud {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 15;
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    }
    .puzzle-slot {
      width: 28vw; height: 28vw; max-width: 130px; max-height: 130px;
      background-size: cover; background-position: center;
      border: 2px solid rgba(255,255,255,0.6); border-radius: 8px;
      opacity: 0.35; transition: opacity 0.3s;
    }
    .puzzle-slot.collected { opacity: 1; }

    #puzzle-finished {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 15; display: none;
      max-width: 70vw; max-height: 70vh;
    }

    #permission-msg {
      position: fixed; inset: 0; z-index: 40; display: none;
      align-items: center; justify-content: center; text-align: center;
      color: #fff; font: 16px sans-serif; background: rgba(0,0,0,0.8); padding: 24px;
    }
  </style>
</head>
<body>
  <div id="mindar-container"></div>
  <video id="hand-video" autoplay playsinline muted></video>
  <canvas id="hand-canvas"></canvas>

  <button id="back-btn">←</button>

  <div id="mode-panel">
    <button id="mode-puzzle" class="active">퍼즐</button>
    <button id="mode-trash">쓰레기줍기</button>
  </div>

  <div id="puzzle-hud">
    <div class="puzzle-slot" id="puzzle-slot-0"></div>
    <div class="puzzle-slot" id="puzzle-slot-1"></div>
    <div class="puzzle-slot" id="puzzle-slot-2"></div>
    <div class="puzzle-slot" id="puzzle-slot-3"></div>
  </div>
  <img id="puzzle-finished" src="" alt="완성" />

  <div id="permission-msg">카메라 권한이 필요합니다<br />브라우저 설정에서 카메라 접근을 허용해주세요</div>

  <script type="module" src="app.js"></script>
</body>
</html>
