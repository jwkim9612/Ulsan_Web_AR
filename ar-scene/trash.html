<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ulsan_AR - Trash Pickup</title>

  <!-- MediaPipe Hands: 8th Wall과 별개의 손 인식 라이브러리(구글, 무료, 오픈소스) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    #back-btn {
      position: fixed; top: 16px; left: 16px; z-index: 30;
      width: 44px; height: 44px; border: none; border-radius: 50%;
      background: rgba(0,0,0,0.5); color: #fff; font: bold 20px sans-serif;
    }

    #mode-panel {
      position: fixed; top: 16px; left: 76px; right: 16px; z-index: 30;
      display: flex; gap: 8px;
      background: rgba(0,0,0,0.4); border-radius: 24px; padding: 6px;
    }
    #mode-panel button {
      flex: 1; border: none; border-radius: 18px; padding: 12px 0;
      font: bold 16px sans-serif; color: #fff; background: transparent;
    }
    #mode-panel button.active { background: #2ea5ff; }

    #recognized-text {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 25; display: none;
      font: bold 28px sans-serif; color: #fff; text-shadow: 0 0 8px #000;
      background: rgba(0,0,0,0.5); padding: 12px 24px; border-radius: 12px;
    }

    #permission-msg {
      position: fixed; inset: 0; z-index: 40; display: none;
      align-items: center; justify-content: center; text-align: center;
      color: #fff; font: 16px sans-serif; background: rgba(0,0,0,0.8); padding: 24px;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>

  <button id="back-btn">←</button>

  <div id="mode-panel">
    <button id="mode-puzzle">퍼즐</button>
    <button id="mode-trash" class="active">쓰레기줍기</button>
  </div>

  <div id="recognized-text">손 인식됨!</div>

  <div id="permission-msg">카메라 권한이 필요합니다<br />브라우저 설정에서 카메라 접근을 허용해주세요</div>

  <script src="trash.js"></script>
</body>
</html>
