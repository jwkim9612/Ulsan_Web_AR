<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ulsan_AR - 퍼즐</title>

  <!-- A-Frame 빌드(8th Wall 전용, 8thwall/aframe-image-targets-example 공식 예제에서 그대로 가져옴) -->
  <script crossorigin="anonymous" src="vendor/8frame-1.5.0.min.js"></script>
  <!-- 8th Wall 엔진(2026-02-28 유료 플랫폼 폐기 이후 오픈소스 CDN 배포 — API 키/계정 불필요) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }

    /* xrextras 로딩 화면의 "Powered by 8th Wall" 워터마크 숨김 */
    .poweredby-img { display: none !important; }

    #back-btn {
      position: fixed; top: 16px; left: 16px; z-index: 30;
      width: 44px; height: 44px; border: none; border-radius: 50%;
      background: rgba(0,0,0,0.5); color: #fff; font: bold 20px sans-serif;
    }

    #mode-panel {
      position: fixed; top: 16px; left: 76px; right: 16px; z-index: 30;
      display: flex; gap: 8px;
      background: rgba(0,0,0,0.4); border-radius: 24px; padding: 6px;
    }
    #mode-panel button {
      flex: 1; border: none; border-radius: 18px; padding: 12px 0;
      font: bold 16px sans-serif; color: #fff; background: transparent;
    }
    #mode-panel button.active { background: #2ea5ff; }

    /* 퍼즐 모드: 화면 중앙 2x2 조각 그리드(못 모은 조각은 반투명) */
    #puzzle-hud {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 15;
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    }
    .puzzle-slot {
      width: 28vw; height: 28vw; max-width: 130px; max-height: 130px;
      background-size: cover; background-position: center;
      border: 2px solid rgba(255,255,255,0.6); border-radius: 8px;
      opacity: 0.35; transition: opacity 0.3s;
    }
    .puzzle-slot.collected { opacity: 1; }

    #puzzle-finished {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 15; display: none;
      max-width: 70vw; max-height: 70vh;
    }
  </style>
</head>
<body>
  <a-scene xrextras-gesture-detector landing-page xrextras-loading xrextras-runtime-error
    renderer="colorManagement:true" xrweb="disableWorldTracking: true">
    <a-camera position="0 0 0"></a-camera>
    <a-light type="ambient" intensity="1"></a-light>

    <!-- name은 image-targets/*.json 생성 시 사용한 타겟 이름과 반드시 일치해야 함 -->
    <xrextras-named-image-target name="p_1"></xrextras-named-image-target>
    <xrextras-named-image-target name="p_2"></xrextras-named-image-target>
    <xrextras-named-image-target name="p_3"></xrextras-named-image-target>
    <xrextras-named-image-target name="p_4"></xrextras-named-image-target>
  </a-scene>

  <button id="back-btn">←</button>

  <div id="mode-panel">
    <button id="mode-puzzle" class="active">퍼즐</button>
    <button id="mode-trash">쓰레기줍기</button>
  </div>

  <div id="puzzle-hud">
    <div class="puzzle-slot" id="puzzle-slot-0"></div>
    <div class="puzzle-slot" id="puzzle-slot-1"></div>
    <div class="puzzle-slot" id="puzzle-slot-2"></div>
    <div class="puzzle-slot" id="puzzle-slot-3"></div>
  </div>
  <img id="puzzle-finished" src="" alt="완성" />

  <script src="puzzle.js"></script>
</body>
</html>
