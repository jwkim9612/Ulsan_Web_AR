<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Ulsan_AR</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #bfe4fb; /* home_bg.png 상단 하늘색과 맞춘 여분 배경 */
    }

    /* 배경: 화면 비율과 무관하게 항상 화면을 꽉 채움(cover). 화면이 배경 이미지(3:4)보다
       세로로 길면(일반 폰) 좌우가, 가로로 넓으면(폴더블 펼침 등) 위아래가 잘릴 수 있음 —
       배경이라 잘려도 문제 없고, 항상 중앙 기준으로 크롭됨. */
    #bg-layer {
      position: fixed; inset: 0;
      background: url('assets/images/home_bg.png') center center / cover no-repeat;
    }

    /* 전경 콘텐츠: 고정 캔버스 대신 뷰포트 비율(vh/vw) + flex로 배치해서
       폰/태블릿/폴더블 어디서나 중앙에 자연스럽게 놓이도록 함. */
    #content {
      position: relative; z-index: 1;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      width: min(92vw, 480px);
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    #logo {
      width: clamp(36px, 10vw, 56px);
      height: auto;
      flex: 0 0 auto;
    }

    #whale {
      width: clamp(150px, 46vw, 260px);
      height: auto;
      flex: 0 0 auto;
      margin-top: clamp(8px, 3vh, 24px);
      filter: drop-shadow(0 8px 16px rgba(0, 60, 100, 0.2));
    }

    #title {
      margin: clamp(10px, 3vh, 20px) 0 0;
      font-size: clamp(22px, 6vw, 30px);
      font-weight: 800;
      color: #0a3d62;
      text-align: center;
    }

    #subtitle {
      margin: 6px 0 0;
      font-size: clamp(13px, 3.6vw, 16px);
      color: #1a5d8a;
      text-align: center;
    }

    #mode-preview {
      display: flex;
      gap: clamp(12px, 4vw, 20px);
      margin-top: clamp(16px, 4vh, 28px);
      flex: 0 0 auto;
    }

    .mode-card {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px;
    }

    .mode-card img {
      width: clamp(64px, 20vw, 92px);
      height: auto;
      display: block;
    }

    .mode-card span {
      font-size: clamp(12px, 3.2vw, 14px);
      font-weight: 700;
      color: #0a3d62;
    }

    /* 남은 공간을 채워서 시작 버튼을 하단(배경의 물결 영역)에 붙임 */
    #spacer { flex: 1 1 auto; min-height: 12px; }

    #start-btn {
      position: relative;
      width: 100%; max-width: 400px;
      border: none; padding: 0; cursor: pointer;
      flex: 0 0 auto;
      transition: filter 0.1s, transform 0.1s;
    }
    #start-btn img { width: 100%; height: auto; display: block; }
    #start-btn span {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding-right: 10%; /* 버튼 이미지 오른쪽 화살표 공간 확보 */
      color: #fff; font-weight: 800;
      font-size: clamp(15px, 4.2vw, 18px);
    }
    #start-btn:active { filter: brightness(0.9); transform: scale(0.97); }
  </style>
</head>
<body ontouchstart="">
  <div id="bg-layer"></div>
  <div id="content">
    <img id="logo" src="assets/images/home_logo.png" alt="" />
    <img id="whale" src="assets/images/home_whale.png" alt="울산 AR 고래 마스코트" />
    <h1 id="title">울산 AR</h1>
    <p id="subtitle">울산에서 만나는 신나는 고래 모험</p>

    <div id="mode-preview">
      <div class="mode-card">
        <img src="assets/images/home_badge_puzzle.png" alt="" />
        <span>퍼즐</span>
      </div>
      <div class="mode-card">
        <img src="assets/images/home_badge_trash.png" alt="" />
        <span>고래구조</span>
      </div>
    </div>

    <div id="spacer"></div>

    <button id="start-btn" onclick="location.href='camera-intro.html'">
      <img src="assets/images/home_start_btn.png" alt="" />
      <span>모험 시작하기</span>
    </button>
  </div>
</body>
</html>
