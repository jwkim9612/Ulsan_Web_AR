<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Puzzle</title>

  <!-- A-Frame 빌드(8th Wall 전용, 8thwall/aframe-image-targets-example 공식 예제에서 그대로 가져옴) -->
  <script crossorigin="anonymous" src="vendor/8frame-1.5.0.min.js"></script>
  <!-- 8th Wall 엔진(오픈소스 전환 후 API 키 불필요) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: center; gap: 12px; padding: 16px;
      pointer-events: none;
    }
    .slot {
      width: 22vw; height: 22vw; max-width: 100px; max-height: 100px;
      border: 2px solid #fff; border-radius: 8px; background: rgba(0,0,0,0.4);
      background-size: cover; background-position: center;
      opacity: 0.4; transition: opacity 0.3s;
    }
    .slot.collected { opacity: 1; }
    #finished {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; background: rgba(0,0,0,0.7);
    }
    #finished img { max-width: 80vw; max-height: 80vh; }
  </style>
</head>
<body>
  <!-- disableWorldTracking: SLAM(월드 트래킹) 불필요 — 마커 인식만 사용 -->
  <a-scene xrextras-gesture-detector landing-page xrextras-loading xrextras-runtime-error
    renderer="colorManagement:true" xrweb="disableWorldTracking: true">
    <a-camera position="0 0 0"></a-camera>
    <a-light type="ambient" intensity="1"></a-light>

    <!-- name은 image-targets/*.json 생성 시 사용한 타겟 이름과 반드시 일치해야 함 -->
    <xrextras-named-image-target name="p_1"></xrextras-named-image-target>
    <xrextras-named-image-target name="p_2"></xrextras-named-image-target>
    <xrextras-named-image-target name="p_3"></xrextras-named-image-target>
    <xrextras-named-image-target name="p_4"></xrextras-named-image-target>
  </a-scene>

  <div id="hud">
    <div class="slot" id="slot-0"></div>
    <div class="slot" id="slot-1"></div>
    <div class="slot" id="slot-2"></div>
    <div class="slot" id="slot-3"></div>
  </div>

  <div id="finished">
    <img id="finished-img" src="" alt="완성" />
  </div>

  <script src="app.js"></script>
</body>
</html>
