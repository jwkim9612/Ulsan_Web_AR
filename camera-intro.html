<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Ulsan_AR - 모험 준비</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #eef7fd;
    }

    /* 배경: 화면 비율과 무관하게 항상 화면을 꽉 채움(cover). 상단은 거의 단색이라
       좌우/상하 어느 쪽이 잘려도 티가 잘 안 남 — 하단 물결만 위치가 살짝 달라짐. */
    #bg-layer {
      position: fixed; inset: 0;
      background: url('assets/images/intro_bg.png') center center / cover no-repeat;
    }

    #content {
      position: relative; z-index: 1;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      width: min(92vw, 480px);
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    #header {
      position: relative;
      width: 100%;
      display: flex; align-items: center; justify-content: center;
      flex: 0 0 auto;
    }
    #back-btn {
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: clamp(36px, 9vw, 44px); height: clamp(36px, 9vw, 44px);
      border: none; padding: 0; background: transparent; cursor: pointer;
      transition: filter 0.1s, transform 0.1s;
    }
    #back-btn img { width: 100%; height: 100%; display: block; }
    #back-btn:active { filter: brightness(0.9); transform: translateY(-50%) scale(0.94); }

    #header-title { display: flex; align-items: center; gap: 6px; }
    #header-title img { width: clamp(18px, 4.6vw, 22px); height: auto; }
    #header-title span {
      font-size: clamp(16px, 4.4vw, 19px);
      font-weight: 800;
      color: #0a2540;
    }

    /* 제목~안전 안내판까지 한 덩어리를 헤더와 하단 버튼 사이 남는 공간에서 위아래로 가운데 정렬 */
    #hero-group {
      flex: 1 1 auto;
      width: 100%;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center;
    }

    #title {
      flex: 0 0 auto;
      text-align: center;
    }
    #title h1 {
      margin: 0;
      font-size: clamp(21px, 5.8vw, 27px);
      font-weight: 800;
      color: #0a2540;
    }
    #title p {
      margin: 6px 0 0;
      font-size: clamp(13px, 3.4vw, 15px);
      color: #4a7a9e;
    }

    #hero {
      width: clamp(190px, 58vw, 300px);
      height: auto;
      flex: 0 0 auto;
      margin-top: clamp(6px, 2vh, 14px);
    }

    #steps {
      width: 100%;
      display: flex;
      gap: clamp(8px, 2.6vw, 14px);
      margin-top: clamp(20px, 5vh, 30px);
      flex: 0 0 auto;
    }
    .step {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
    }
    .step-num {
      position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
      z-index: 2;
      width: clamp(22px, 6vw, 26px); height: clamp(22px, 6vw, 26px);
      border-radius: 50%;
      background: #eaf4fd;
      color: #1f6fb2;
      font-weight: 800;
      font-size: clamp(11px, 3vw, 13px);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(10, 60, 100, 0.15);
    }
    .step img { width: 100%; height: auto; display: block; }
    .step-caption {
      position: absolute; left: 6%; right: 6%; bottom: 12%;
      text-align: center;
      font-size: clamp(10.5px, 2.9vw, 12.5px);
      font-weight: 700;
      color: #0a3d62;
      line-height: 1.3;
    }

    #safety-bar {
      position: relative;
      width: 100%;
      margin-top: clamp(14px, 3.5vh, 22px);
      flex: 0 0 auto;
    }
    #safety-bar img { width: 100%; height: auto; display: block; }
    #safety-bar span {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(12.5px, 3.4vw, 14.5px);
      font-weight: 700;
      color: #7a5c12;
    }

    #camera-btn {
      position: relative;
      width: 100%; max-width: 400px;
      border: none; padding: 0; cursor: pointer;
      background: transparent;
      -webkit-appearance: none; appearance: none;
      flex: 0 0 auto;
      transition: filter 0.1s, transform 0.1s;
    }
    #camera-btn img { width: 100%; height: auto; display: block; }
    #camera-btn span {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800;
      font-size: clamp(15px, 4.2vw, 18px);
    }
    #camera-btn:active { filter: brightness(0.9); transform: scale(0.97); }

    #tagline {
      margin-top: 10px;
      flex: 0 0 auto;
      font-size: clamp(12px, 3.2vw, 14px);
      color: #4a7a9e;
      text-align: center;
    }
  </style>
</head>
<body ontouchstart="">
  <div id="bg-layer"></div>
  <div id="content">
    <div id="header">
      <button id="back-btn" onclick="location.href='index.html'">
        <img src="assets/images/intro_back_btn.png" alt="뒤로가기" />
      </button>
      <div id="header-title">
        <img src="assets/images/intro_logo.png" alt="" />
        <span>모험 준비</span>
      </div>
    </div>

    <div id="hero-group">
      <div id="title">
        <h1>카메라로 모험을 시작해요</h1>
        <p>주변 풍경 위에 고래가 나타나요</p>
      </div>

      <img id="hero" src="assets/images/intro_hero.png" alt="카메라로 고래를 비추는 모습" />

      <div id="steps">
        <div class="step">
          <div class="step-num">1</div>
          <img src="assets/images/intro_step_camera.png" alt="" />
          <span class="step-caption">카메라 접근을<br>허용해요</span>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <img src="assets/images/intro_step_move.png" alt="" />
          <span class="step-caption">휴대폰을<br>천천히 움직여요</span>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <img src="assets/images/intro_step_mission.png" alt="" />
          <span class="step-caption">안내에 따라<br>미션을 즐겨요</span>
        </div>
      </div>

      <div id="safety-bar">
        <img src="assets/images/intro_safety_bar.png" alt="" />
        <span>주변을 살피며 안전하게 이동해요</span>
      </div>
    </div>

    <button id="camera-btn" onclick="location.href='ar-scene/index.html'">
      <img src="assets/images/intro_camera_btn.png" alt="" />
      <span>카메라 켜기</span>
    </button>

    <p id="tagline">카메라 접근을 허용하면 모험이 시작돼요</p>
  </div>
</body>
</html>
