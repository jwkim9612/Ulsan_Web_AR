<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ulsan_AR - 고래구조</title>

  <!-- A-Frame 빌드(8th Wall 전용, 8thwall/aframe-image-targets-example 공식 예제에서 그대로 가져옴) -->
  <script crossorigin="anonymous" src="vendor/8frame-1.5.0.min.js"></script>
  <!-- 8th Wall 엔진(2026-02-28 유료 플랫폼 폐기 이후 오픈소스 CDN 배포 — API 키/계정 불필요) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
  <!-- 위 8th Wall 번들들이 영어로 그려 넣는 카메라/모션 센서 권한 안내 문구를 한글로 바꿔치기 -->
  <script src="localize-8thwall-ui.js"></script>

  <!-- 잡기/흔들기 판정 = MediaPipe Hands(구글, 무료). World Tracking이 이미 잡고 있는 카메라
       프레임을 XR8.CameraPixelArray로 넘겨받아 쓰므로 별도 getUserMedia(camera_utils)는 필요 없음. -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }

    /* xrextras 로딩 화면의 "Powered by 8th Wall" 워터마크 숨김 */
    .poweredby-img { display: none !important; }

    #hand-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 5; pointer-events: none;
    }

    /* 상단 카드(뒤로가기+로고/타이틀+현재 모드) + 상태 뱃지 — camera-intro.html/scan.html과
       동일한 톤. 실제 폭/위치 계산이 필요해서 flex-column인 #top-chrome 안에 쌓는다. */
    #top-chrome {
      position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%); z-index: 30;
      width: min(92vw, 480px);
      display: flex; flex-direction: column; align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    #top-panel {
      width: 100%;
      background: #f7fcff;
      border: 1px solid #deeef8;
      border-radius: 22px;
      padding: 12px 14px;
      box-sizing: border-box;
    }
    #top-panel-row1 { position: relative; display: flex; align-items: center; justify-content: center; }
    #back-btn {
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: clamp(34px, 8.5vw, 40px); height: clamp(34px, 8.5vw, 40px);
      border: none; padding: 0; background: transparent; cursor: pointer;
      transition: filter 0.1s, transform 0.1s;
    }
    #back-btn img { width: 100%; height: 100%; display: block; }
    #back-btn:active { filter: brightness(0.9); transform: translateY(-50%) scale(0.94); }

    #header-title { display: flex; align-items: center; gap: 6px; }
    #header-title img { width: clamp(16px, 4.2vw, 20px); height: auto; }
    #header-title span { font-size: clamp(15px, 4vw, 18px); font-weight: 800; color: #0a2540; }

    #mode-pill {
      margin: 10px auto 0;
      width: fit-content;
      background: #087df0;
      color: #fff;
      font-weight: 800;
      font-size: clamp(13px, 3.6vw, 15px);
      padding: 8px 22px;
      border-radius: 999px;
    }

    #status-pill {
      margin-top: clamp(12px, 3vh, 18px);
      background: #ddf8f6;
      color: #126c75;
      font-weight: 800;
      font-size: clamp(12.5px, 3.4vw, 14.5px);
      padding: 9px 20px;
      border-radius: 999px;
    }

    /* 하단 안내 카드 — scan.html 하단 카드와 동일 톤 */
    #bottom-panel {
      position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%); z-index: 30;
      width: min(92vw, 480px);
      background: #f7fcff;
      border: 1px solid #deeef8;
      border-radius: 22px;
      padding: 18px 16px;
      box-sizing: border-box;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    #bottom-panel h2 {
      margin: 0;
      font-size: clamp(16px, 4.4vw, 19px);
      font-weight: 800;
      color: #0a2540;
    }
    #bottom-panel p {
      margin: 6px 0 0;
      font-size: clamp(12.5px, 3.4vw, 14px);
      color: #4a7a9e;
    }

    #trash-count {
      position: fixed; top: 190px; left: 0; right: 0; z-index: 20;
      display: flex; justify-content: center;
      color: #fff; font: bold 20px sans-serif;
    }
    #trash-count span {
      background: rgba(0,0,0,0.4); padding: 6px 16px; border-radius: 20px;
    }

    #trash-hint {
      position: fixed; bottom: 115px; left: 0; right: 0; z-index: 20;
      display: flex; justify-content: center;
      color: #fff; font: 16px sans-serif; text-shadow: 0 0 6px #000;
      pointer-events: none;
    }

    /* 다 구하면 잠깐 보여주는 완료 문구(완료 화면 뜨기 전 즉시 피드백) */
    #trash-finished {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 25; display: none;
      font: bold 24px sans-serif; color: #fff; text-align: center;
      background: rgba(0,0,0,0.5); padding: 16px 28px; border-radius: 12px;
    }

    /* 미션 완료 화면 — camera-intro.html 계열과 같은 톤의 축하 화면 */
    #complete-overlay {
      position: fixed; inset: 0; z-index: 50; display: none;
      overflow-y: auto;
      background: #e5f9f7; /* 배경 이미지 로드 전/여백에 보일 폴백색, 아래 요소들이 절대 비치지 않게 */
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    #complete-bg {
      position: absolute; inset: 0; z-index: -1;
      background: url('../assets/images/complete_trash_bg.png') center center / cover no-repeat;
    }
    #complete-content {
      min-height: 100%;
      display: flex; flex-direction: column; align-items: center;
      width: min(92vw, 480px);
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom));
      box-sizing: border-box;
      text-align: center;
    }
    #complete-logo { width: clamp(28px, 7vw, 34px); height: auto; flex: 0 0 auto; }

    /* 뱃지~카드까지 한 덩어리를 로고와 버튼 사이 남는 공간에서 위아래로 가운데 정렬 */
    #complete-hero {
      flex: 1 1 auto;
      width: 100%;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center;
    }

    #complete-badge {
      position: relative;
      width: fit-content;
    }
    #complete-badge img { display: block; height: clamp(30px, 8vw, 38px); width: auto; }
    #complete-badge span {
      position: absolute; top: 0; bottom: 0; left: 26%; right: 8%;
      display: flex; align-items: center;
      font-size: clamp(12.5px, 3.4vw, 14.5px);
      font-weight: 800;
      color: #008e9b;
      white-space: nowrap;
    }

    #complete-title {
      margin: clamp(10px, 3vh, 16px) 0 0;
      font-size: clamp(28px, 8vw, 38px);
      font-weight: 800;
      color: #008e9b;
    }

    #complete-whale {
      width: clamp(190px, 56vw, 300px);
      height: auto;
      margin-top: clamp(10px, 3vh, 20px);
    }

    #complete-card {
      width: 100%;
      background: #fff;
      border-radius: 22px;
      padding: clamp(18px, 4vh, 26px) 20px;
      box-sizing: border-box;
      margin-top: clamp(14px, 3.5vh, 22px);
      box-shadow: 0 6px 20px rgba(10, 60, 100, 0.08);
    }
    #complete-card h2 {
      margin: 0;
      font-size: clamp(18px, 4.8vw, 21px);
      font-weight: 800;
      color: #0a2540;
    }
    #complete-card p {
      margin: 8px 0 0;
      font-size: clamp(13px, 3.4vw, 15px);
      color: #4a7a9e;
    }

    #complete-btn {
      position: relative;
      width: 100%; max-width: 400px;
      border: none; padding: 0; cursor: pointer;
      background: transparent;
      -webkit-appearance: none; appearance: none;
      margin-top: clamp(18px, 4.5vh, 26px);
      transition: filter 0.1s, transform 0.1s;
    }
    #complete-btn img { width: 100%; height: auto; display: block; }
    #complete-btn span {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800;
      font-size: clamp(15px, 4.2vw, 18px);
    }
    #complete-btn:active { filter: brightness(0.92); transform: scale(0.97); }
  </style>
</head>
<body>
  <a-scene xrextras-gesture-detector landing-page xrextras-loading xrextras-runtime-error
    renderer="colorManagement:true" xrweb="allowedDevices: MOBILE_AND_HEADSETS">
    <a-camera position="0 0 0"></a-camera>
    <a-light type="ambient" intensity="1"></a-light>
    <a-entity id="trash-root"></a-entity>
  </a-scene>

  <canvas id="hand-canvas"></canvas>

  <div id="top-chrome">
    <div id="top-panel">
      <div id="top-panel-row1">
        <button id="back-btn">
          <img src="../assets/images/intro_back_btn.png" alt="뒤로가기" />
        </button>
        <div id="header-title">
          <img src="../assets/images/intro_logo.png" alt="" />
          <span>울산 AR</span>
        </div>
      </div>
      <div id="mode-pill">고래구조</div>
    </div>
    <div id="status-pill">미션 진행 중</div>
  </div>

  <div id="trash-count"><span id="trash-count-text">0/3</span></div>
  <div id="trash-hint"></div>
  <div id="trash-finished">장생이를 모두 구했어요!</div>

  <div id="bottom-panel">
    <h2>화면 속 미션을 진행해 주세요</h2>
    <p>주변을 살피며 천천히 움직여요</p>
  </div>

  <div id="complete-overlay">
    <div id="complete-bg"></div>
    <div id="complete-content">
      <img id="complete-logo" src="../assets/images/intro_logo.png" alt="" />
      <div id="complete-hero">
        <div id="complete-badge">
          <img src="../assets/images/complete_trash_badge.png" alt="" />
          <span>고래 구조 · 미션 성공</span>
        </div>
        <h1 id="complete-title">고래 구조 성공!</h1>
        <img id="complete-whale" src="../assets/images/complete_whale.png" alt="" />
        <div id="complete-card">
          <h2>정말 잘했어요!</h2>
          <p>고래가 다시 자유로워졌어요. 고마워요!</p>
        </div>
      </div>
      <button id="complete-btn" onclick="SFX.navigate('scan.html')">
        <img src="../assets/images/complete_trash_btn.png" alt="" />
        <span>카메라 화면으로 돌아가기</span>
      </button>
    </div>
  </div>

  <script src="../assets/sfx.js" data-base="../assets/sounds/"></script>
  <script src="trash.js"></script>
</body>
</html>
