<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Seaclean</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #012; }
    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #scene { position: fixed; inset: 0; }
    #hud {
      position: fixed; top: 16px; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: center; pointer-events: none;
    }
    #count {
      color: #fff; font: bold 20px sans-serif; background: rgba(0,0,0,0.4);
      padding: 6px 16px; border-radius: 20px;
    }
    #hint {
      position: fixed; bottom: 40px; left: 0; right: 0; z-index: 10;
      text-align: center; color: #fff; font: 16px sans-serif; pointer-events: none;
      text-shadow: 0 0 6px #000;
    }
    #start, #finished {
      position: fixed; inset: 0; z-index: 20; display: flex;
      align-items: center; justify-content: center; flex-direction: column; gap: 16px;
      background: rgba(0,0,0,0.75); color: #fff; font: 18px sans-serif; text-align: center;
    }
    #finished { display: none; }
    button {
      font: bold 18px sans-serif; padding: 12px 28px; border-radius: 24px; border: none;
      background: #2ea5ff; color: #fff;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="scene"></canvas>

  <div id="hud"><div id="count">0/5</div></div>
  <div id="hint"></div>

  <div id="start">
    <div>바다 청소 게임<br />화면을 눌러 카메라를 켜주세요</div>
    <button id="start-btn">시작하기</button>
  </div>

  <div id="finished">
    <div>바다를 다 치웠어요!</div>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
