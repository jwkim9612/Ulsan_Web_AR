<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ulsan_AR - 모험 준비</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #013a5e; /* 뷰포트 비율이 360:780과 안 맞을 때 레터박스 색 */
    }

    #stage-outer {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }

    /* 디자인 기준 캔버스: 360x780 CSS px. 실제 뷰포트에 맞춰 아래 스크립트가
       transform:scale()로 배경/버튼을 통째로 같은 배율로 확대·축소한다. */
    #stage {
      position: relative;
      width: 360px; height: 780px;
      transform-origin: center center;
    }

    #bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }

    .icon-btn, #camera-btn {
      position: absolute;
      border: none; padding: 0; background: transparent; cursor: pointer;
      transition: filter 0.1s, transform 0.1s;
    }
    .icon-btn img, #camera-btn img { width: 100%; height: 100%; display: block; }
    .icon-btn:active, #camera-btn:active { filter: brightness(0.85); transform: scale(0.96); }

    #back-btn { left: 20px; top: 20px; width: 42px; height: 42px; }
    #camera-btn { left: 20px; top: 637px; width: 320px; height: 50px; }
  </style>
</head>
<body ontouchstart="">
  <div id="stage-outer">
    <div id="stage">
      <img id="bg" src="assets/images/camera_intro_bg.png" alt="모험 준비 - 카메라로 모험을 시작해요" />
      <button id="back-btn" class="icon-btn" onclick="location.href='index.html'">
        <img src="assets/images/back_btn.png" alt="뒤로가기" />
      </button>
      <button id="camera-btn" onclick="location.href='ar-scene/index.html'">
        <img src="assets/images/camera_on_btn.png" alt="카메라 켜기" />
      </button>
    </div>
  </div>

  <script>
    var stage = document.getElementById('stage');
    function fitStage() {
      var scale = Math.min(window.innerWidth / 360, window.innerHeight / 780);
      stage.style.transform = 'scale(' + scale + ')';
    }
    fitStage();
    window.addEventListener('resize', fitStage);
    window.addEventListener('orientationchange', fitStage);
  </script>
</body>
</html>
