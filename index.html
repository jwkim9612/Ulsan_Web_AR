<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Ulsan_AR</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #bfe4fb; /* home_bg.png 상단 하늘색과 맞춘 여분 배경 */
    }

    /* 배경: 화면 비율과 무관하게 항상 화면을 꽉 채움(cover). 화면이 배경 이미지(3:4)보다
       세로로 길면(일반 폰) 좌우가, 가로로 넓으면(폴더블 펼침 등) 위아래가 잘릴 수 있음 —
       배경이라 잘려도 문제 없고, 항상 중앙 기준으로 크롭됨. */
    #bg-layer {
      position: fixed; inset: 0;
      background: url('assets/images/home_bg.png') center center / cover no-repeat;
    }

    /* 전경 콘텐츠: 고정 캔버스 대신 뷰포트 비율(vh/vw) + flex로 배치해서
       폰/태블릿/폴더블 어디서나 중앙에 자연스럽게 놓이도록 함. */
    #content {
      position: relative; z-index: 1;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: flex-start;
      width: min(92vw, 480px);
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    #header {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      flex: 0 0 auto;
    }
    #header img { width: clamp(18px, 4.6vw, 22px); height: auto; }
    #header h1 {
      margin: 0;
      font-size: clamp(16px, 4.4vw, 19px);
      font-weight: 800;
      color: #0a2540;
    }

    /* 뱃지~고래까지 한 덩어리를 헤더와 하단 블록 사이 남는 공간에서 위아래로 가운데 정렬 */
    #hero {
      flex: 1 1 auto;
      width: 100%;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center;
      text-align: center;
    }

    #badge {
      flex: 0 0 auto;
      background: rgba(43, 122, 226, 0.12);
      color: #1f6fb2;
      font-size: clamp(12px, 3.2vw, 14px);
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 999px;
    }

    #title {
      margin: clamp(14px, 4vh, 22px) 0 0;
      flex: 0 0 auto;
    }
    #title span {
      display: block;
      font-size: clamp(20px, 6.2vw, 28px);
      font-weight: 800;
      line-height: 1.32;
    }
    #title .line1 { color: #0a2540; }
    #title .line2 { color: #1f7ae0; }

    #subtitle {
      margin: 4px 0 0;
      flex: 0 0 auto;
      font-size: clamp(13px, 3.4vw, 15px);
      color: #4a7a9e;
    }

    #whale {
      width: clamp(150px, 46vw, 260px);
      height: auto;
      flex: 0 0 auto;
      margin-top: clamp(8px, 2.5vh, 20px);
      filter: drop-shadow(0 8px 16px rgba(0, 60, 100, 0.2));
    }

    #mode-preview {
      align-self: center;
      display: flex;
      gap: clamp(12px, 4vw, 20px);
      flex: 0 0 auto;
    }

    .mode-card {
      position: relative;
      width: clamp(64px, 20vw, 92px);
    }

    .mode-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .mode-card span {
      position: absolute;
      left: 0; right: 0; bottom: 22%;
      font-size: clamp(12px, 3.2vw, 14px);
      font-weight: 700;
      color: #0a3d62;
      text-align: center;
    }

    #start-btn {
      align-self: center;
      position: relative;
      width: 100%; max-width: 400px;
      border: none; padding: 0; cursor: pointer;
      background: transparent;
      -webkit-appearance: none; appearance: none;
      flex: 0 0 auto;
      margin-top: clamp(16px, 4vh, 24px);
      transition: filter 0.1s, transform 0.1s;
    }
    #start-btn img { width: 100%; height: auto; display: block; }
    #start-btn span {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800;
      font-size: clamp(15px, 4.2vw, 18px);
    }
    #start-btn:active { filter: brightness(0.9); transform: scale(0.97); }

    #tagline {
      align-self: center;
      margin-top: 10px;
      flex: 0 0 auto;
      font-size: clamp(12px, 3.2vw, 14px);
      color: #4a7a9e;
      text-align: center;
    }
  </style>
</head>
<body ontouchstart="">
  <div id="bg-layer"></div>
  <div id="content">
    <div id="header">
      <img src="assets/images/home_logo.png" alt="" />
      <h1>울산 AR</h1>
    </div>

    <div id="hero">
      <div id="badge">우리 동네 AR 모험</div>

      <div id="title">
        <span class="line1">울산에서 만나는</span>
        <span class="line2">신나는 고래 모험</span>
      </div>
      <p id="subtitle">퍼즐을 맞추고, 고래를 구해요!</p>

      <img id="whale" src="assets/images/home_whale.png" alt="울산 AR 고래 마스코트" />
    </div>

    <div id="mode-preview">
      <div class="mode-card">
        <img src="assets/images/home_badge_puzzle.png" alt="" />
        <span>고래 퍼즐</span>
      </div>
      <div class="mode-card">
        <img src="assets/images/home_badge_trash.png" alt="" />
        <span>고래 구조</span>
      </div>
    </div>

    <button id="start-btn" onclick="SFX.navigate('camera-intro.html')">
      <img src="assets/images/home_start_btn.png" alt="" />
      <span>모험 시작하기</span>
    </button>

    <p id="tagline">앱 설치 없이 바로 즐겨요</p>
  </div>

  <script src="assets/sfx.js" data-base="assets/sounds/"></script>
</body>
</html>
