<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ulsan_AR - 쓰레기줍기</title>

  <!-- A-Frame 빌드(8th Wall 전용, 8thwall/aframe-image-targets-example 공식 예제에서 그대로 가져옴) -->
  <script crossorigin="anonymous" src="vendor/8frame-1.5.0.min.js"></script>
  <!-- 8th Wall 엔진(2026-02-28 유료 플랫폼 폐기 이후 오픈소스 CDN 배포 — API 키/계정 불필요) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>

  <!-- 쓰다듬기 판정 = MediaPipe Hands(구글, 무료). World Tracking이 이미 잡고 있는 카메라 프레임을
       XR8.CameraPixelArray로 넘겨받아 쓰므로 별도 getUserMedia(camera_utils)는 필요 없음. -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }

    #hand-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 5; pointer-events: none;
    }

    #back-btn {
      position: fixed; top: 16px; left: 16px; z-index: 30;
      width: 44px; height: 44px; border: none; border-radius: 50%;
      background: rgba(0,0,0,0.5); color: #fff; font: bold 20px sans-serif;
    }

    #mode-panel {
      position: fixed; top: 16px; left: 76px; right: 16px; z-index: 30;
      display: flex; gap: 8px;
      background: rgba(0,0,0,0.4); border-radius: 24px; padding: 6px;
    }
    #mode-panel button {
      flex: 1; border: none; border-radius: 18px; padding: 12px 0;
      font: bold 16px sans-serif; color: #fff; background: transparent;
    }
    #mode-panel button.active { background: #2ea5ff; }

    #trash-count {
      position: fixed; top: 76px; left: 0; right: 0; z-index: 20;
      display: flex; justify-content: center;
      color: #fff; font: bold 20px sans-serif;
    }
    #trash-count span {
      background: rgba(0,0,0,0.4); padding: 6px 16px; border-radius: 20px;
    }

    #trash-hint {
      position: fixed; bottom: 40px; left: 0; right: 0; z-index: 20;
      display: flex; justify-content: center;
      color: #fff; font: 16px sans-serif; text-shadow: 0 0 6px #000;
      pointer-events: none;
    }

    #trash-finished {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 25; display: none;
      font: bold 24px sans-serif; color: #fff; text-align: center;
      background: rgba(0,0,0,0.5); padding: 16px 28px; border-radius: 12px;
    }
  </style>
</head>
<body>
  <a-scene xrextras-gesture-detector landing-page xrextras-loading xrextras-runtime-error
    renderer="colorManagement:true" xrweb="allowedDevices: MOBILE_AND_HEADSETS">
    <a-camera position="0 0 0"></a-camera>
    <a-light type="ambient" intensity="1"></a-light>
    <a-entity id="trash-root"></a-entity>
  </a-scene>

  <canvas id="hand-canvas"></canvas>

  <button id="back-btn">←</button>

  <div id="mode-panel">
    <button id="mode-puzzle">퍼즐</button>
    <button id="mode-trash" class="active">쓰레기줍기</button>
  </div>

  <div id="trash-count"><span id="trash-count-text">0/5</span></div>
  <div id="trash-hint"></div>
  <div id="trash-finished">쓰레기를 다 치웠어요!</div>

  <script src="trash.js"></script>
</body>
</html>
